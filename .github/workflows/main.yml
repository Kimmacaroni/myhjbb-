name: Daily Foodpia Bot

# 식단 브리핑만 담당하는 단발 실행 워크플로입니다.
#
# ⚠️ 자동 실행(schedule)은 꺼뒀습니다. Cloudflare Workers 봇이 같은 채널에
# 매일 식단을 자동으로 보내고 있어서, 이 워크플로까지 자동 실행되면 매일
# 식단이 두 번 올라갑니다. 필요하면 아래에서 언제든 수동으로만 실행하세요.

on:
  workflow_dispatch: # 수동 실행 버튼만 남겨둠 (자동 스케줄 없음)

# 이전 실행이 밀렸을 때 겹쳐 돌아 식단이 두 번 올라가는 것을 막습니다.
concurrency:
  group: daily-menu
  cancel-in-progress: false

jobs:
  send-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MENU_CHANNEL_ID: ${{ secrets.MENU_CHANNEL_ID }}
        run: python food_bot.py
