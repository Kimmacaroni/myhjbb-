name: Daily Foodpia Bot

# 매일 KST 오전 6시에 식단 브리핑을 전송합니다.
# GitHub Actions cron은 UTC 기준이므로 21:00 UTC = 다음 날 06:00 KST입니다.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# 이전 실행이 밀렸을 때 겹쳐 돌아 식단이 두 번 올라가는 것을 막습니다.
concurrency:
  group: daily-menu
  cancel-in-progress: false

jobs:
  send-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MENU_CHANNEL_ID: ${{ secrets.MENU_CHANNEL_ID }}
        run: python food_bot.py
