name: Daily Foodpia Bot

on:
  schedule:
    # 한국 시간(KST) 오전 6시 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          # 진짜 봇 작동에 필요한 라이브러리를 추가로 설치합니다.
          pip install requests beautifulsoup4 discord.py
      - name: Run Bot
        run: python food_bot.py
